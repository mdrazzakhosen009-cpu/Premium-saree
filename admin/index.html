<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAREE Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:Inter,system-ui,sans-serif}.login{min-height:100vh;display:grid;place-items:center}.card{background:#121212;border:1px solid #333;border-radius:22px;padding:28px;width:min(420px,92%)}input,textarea,select{width:100%;padding:11px;background:#090909;border:1px solid #333;color:#fff;border-radius:9px;margin:5px 0}.btn{background:#d8b46a;border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#0f0f0f;border-right:1px solid #292929;padding:20px}.side h1{font:30px Georgia;color:#d8b46a}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#bbb;padding:12px;border-radius:8px;cursor:pointer}.side button.active,.side button:hover{background:#1d1d1d;color:#fff}.main{padding:25px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat,.panel{background:#121212;border:1px solid #292929;border-radius:16px;padding:18px}.stat b{display:block;font-size:28px;color:#d8b46a;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #292929;text-align:left;white-space:nowrap}.product{display:flex;gap:12px;align-items:center;border-bottom:1px solid #252525;padding:10px 0}.product img{width:55px;height:65px;object-fit:cover;border-radius:8px;background:#222}.danger{background:#7b2828;color:white}.muted{color:#888}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:3;display:flex;overflow:auto;gap:5px}.side h1{display:none}.side button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:15px}}
</style></head><body>
<div id="login" class="login"><div class="card"><h2>Admin Login</h2><input id="lp" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Login</button><p id="le" class="muted"></p></div></div>
<div id="app" class="layout hidden"><aside class="side"><h1>SAREE</h1><button onclick="page('dashboard')" class="active">Dashboard</button><button onclick="page('products')">Products</button><button onclick="page('orders')">Orders</button><button onclick="page('agents')">Agents</button><button onclick="page('settings')">Store Settings</button><button onclick="page('password')">Change Password</button><button onclick="logout()">Logout</button></aside><main class="main"><div class="top"><h2 id="title">Dashboard</h2><span class="muted">Secure Admin</span></div><div id="content"></div></main></div>
<script>
let token=localStorage.getItem("saree-token")||"";
const api=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:"Bearer "+token};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
if(token) loginOK();
async function loginOK(){login.classList.add("hidden");app.classList.remove("hidden");page("dashboard")}
async function login(){try{let d=await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:lp.value})});token=d.token;localStorage.setItem("saree-token",token);loginOK()}catch(e){le.textContent=e.message}}
async function logout(){try{await api("/api/admin/post",{method:"POST"});}catch(e){}localStorage.removeItem("saree-token");location.reload()}
function page(p){document.querySelectorAll(".side button").forEach(b=>b.classList.remove("active"));[...document.querySelectorAll(".side button")].find(b=>b.textContent.toLowerCase().includes(p==="settings"?"store":p==="password"?"change":p))?.classList.add("active");title.textContent=p[0].toUpperCase()+p.slice(1);({dashboard:dash,products:productsPage,orders:ordersPage,agents:agentsPage,settings:settingsPage,password:passwordPage}[p])()}
async function dash(){let d=await api("/api/admin/dashboard");content.innerHTML=`<div class="stats"><div class="stat">Revenue<b>৳${d.revenue.toLocaleString("en-BD")}</b></div><div class="stat">Orders<b>${d.orders}</b></div><div class="stat">Products<b>${d.products}</b></div><div class="stat">Agents<b>${d.agents}</b></div></div><div class="panel"><h3>Store Control</h3><p class="muted">Turso database connected through the server.</p></div>`}
async function productsPage(){let ps=await api("/api/admin/products");content.innerHTML=`<div class="panel"><h3>Add / Edit Product</h3><div class="grid"><div><input id="pn" placeholder="Product name"><input id="pp" type="number" placeholder="Price"><input id="po" type="number" placeholder="Old price"><input id="pc" placeholder="Category"><input id="ps" type="number" placeholder="Stock"><textarea id="pd" placeholder="Description"></textarea><input id="pt" placeholder="Tags"><input id="pi" placeholder="Image URL or data URL"><label><input id="pf" type="checkbox"> Featured</label><label><input id="pnw" type="checkbox" checked> New</label><button class="btn" onclick="saveProduct()">Save Product</button></div><div><input id="file" type="file" accept="image/*" onchange="readImg(this)"><button class="btn" onclick="aiProduct()">🤖 AI Product Info</button></div></div></div><div class="panel" style="margin-top:15px"><h3>Products</h3>${ps.map(p=>`<div class="product"><img src="${p.image||""}"><div style="flex:1"><b>${esc(p.name)}</b><div>৳${p.price} · ${esc(p.category)} · Stock ${p.stock}</div></div><button class="btn" onclick='edit(${JSON.stringify(p)})'>Edit</button><button class="btn danger" onclick="del(${p.id})">Delete</button></div>`).join("")}</div>`}
let imageData="";function readImg(i){let r=new FileReader();r.onload=()=>imageData=r.result;r.readAsDataURL(i.files[0])}
async function saveProduct(){let b={name:pn.value,price:pp.value,old_price:po.value,category:pc.value,stock:ps.value,description:pd.value,tags:pt.value,image:imageData||pi.value,featured:pf.checked,is_new:pnw.checked};if(window.editId)await api("/api/admin/products/"+editId,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});else await api("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});window.editId=null;imageData="";productsPage()}
function edit(p){window.editId=p.id;pn.value=p.name;pp.value=p.price;po.value=p.old_price;pc.value=p.category;ps.value=p.stock;pd.value=p.description;pt.value=p.tags;pi.value=p.image||"";pf.checked=!!p.featured;pnw.checked=!!p.is_new;scrollTo(0,0)}
async function del(id){if(confirm("Delete product?")){await api("/api/admin/products/"+id,{method:"DELETE"});productsPage()}}
async function aiProduct(){let f=document.getElementById("file").files[0];if(!f)return alert("আগে image select করুন");let fd=new FormData();fd.append("image",f);let r=await fetch("/api/admin/ai-product",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});let d=await r.json();let x=d.preview;pn.value=x.name||pn.value;pc.value=x.category||pc.value;pd.value=x.description||"";pt.value=x.tags||""}
async function ordersPage(){let os=await api("/api/admin/orders");content.innerHTML=`<div class="panel table"><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr>${os.map(o=>`<tr><td>${o.order_code}</td><td>${esc(o.customer_name)}<br>${esc(o.phone)}</td><td>৳${o.total}</td><td>${esc(o.payment_method)}<br>${esc(o.transaction_id||"")}</td><td>${esc(o.status)}</td><td><select onchange="status(${o.id},this.value)">${["Pending","Confirmed","Shipped","Delivered","Cancelled"].map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}</table></div>`}
async function status(id,v){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:v})})}
async function agentsPage(){let a=await api("/api/admin/agents");content.innerHTML=`<div class="panel"><h3>Add Agent</h3><div class="grid"><input id="an" placeholder="Name"><input id="aph" placeholder="Phone"><input id="aw" placeholder="WhatsApp number"><input id="am" placeholder="Messenger URL"><button class="btn" onclick="addAgent()">Add Agent</button></div></div><div class="panel" style="margin-top:15px">${a.map(x=>`<div class="product"><div style="flex:1"><b>${esc(x.name)}</b><div>${esc(x.phone)} · ${esc(x.whatsapp)}</div></div><button class="btn danger" onclick="removeAgent(${x.id})">Delete</button></div>`).join("")}</div>`}
async function addAgent(){await api("/api/admin/agents",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:an.value,phone:aph.value,whatsapp:aw.value,messenger:am.value,active:true})});agentsPage()}
async function removeAgent(id){await api("/api/admin/agents/"+id,{method:"DELETE"});agentsPage()}
async function settingsPage(){let s=await api("/api/settings");content.innerHTML=`<div class="panel"><h3>Website & Chatbot Control</h3><div class="grid"><div>${field("Store Name","store_name",s.store_name)}${field("Store Tagline","store_tagline",s.store_tagline)}${field("Delivery Time","delivery_time",s.delivery_time)}${field("Delivery Fee","delivery_fee",s.delivery_fee)}${field("Store Info","store_info",s.store_info,true)}</div><div>${field("bKash Number","bkash_number",s.bkash_number)}${field("Nagad Number","nagad_number",s.nagad_number)}${field("Rocket Number","rocket_number",s.rocket_number)}${field("COD Enabled (true/false)","cod_enabled",s.cod_enabled)}</div></div><hr><h3>Chatbot Info Customization</h3><div class="grid">${field("Chatbot Store Info","chatbot_store",s.chatbot_store,true)}${field("Chatbot Delivery Info","chatbot_delivery",s.chatbot_delivery,true)}${field("Chatbot Order Info","chatbot_order",s.chatbot_order,true)}</div><button class="btn" onclick="saveSettings()">Save All Settings</button></div>`}
function field(k,n,v,ta=false){return `<label style="display:block;margin:8px 0">${k}${ta?`<textarea id="s_${n}">${esc(v||"")}</textarea>`:`<input id="s_${n}" value="${esc(v||"")}">`}</label>`}
async function saveSettings(){let names=["store_name","store_tagline","delivery_time","delivery_fee","store_info","bkash_number","nagad_number","rocket_number","cod_enabled","chatbot_store","chatbot_delivery","chatbot_order"];let b={};names.forEach(n=>b[n]=document.getElementById("s_"+n).value);await api("/api/admin/settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});alert("Settings saved")}
function passwordPage(){content.innerHTML=`<div class="panel" style="max-width:500px"><h3>Change Admin Password</h3><input id="cp" type="password" placeholder="Current password"><input id="np" type="password" placeholder="New password (6+ characters)"><button class="btn" onclick="changePass()">Change Password</button></div>`}
async function changePass(){await api("/api/admin/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({old_password:cp.value,new_password:np.value})});alert("Password changed")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
