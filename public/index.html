<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAREE — Premium Saree Collection</title><style>
:root{--bg:#080808;--card:#121212;--gold:#d8b46a;--text:#f7f3ea;--muted:#aaa;--line:#262626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.top{padding:8px;text-align:center;background:#111;color:#d8b46a;font-size:13px}.nav{position:sticky;top:0;z-index:5;background:rgba(8,8,8,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.navin{max-width:1200px;margin:auto;display:flex;align-items:center;gap:22px;padding:14px 20px}.logo{width:150px}.search{flex:1;display:flex;background:#141414;border:1px solid #333;border-radius:30px;overflow:hidden}.search input{flex:1;background:none;border:0;outline:0;color:white;padding:12px 16px}.search button,.btn{background:var(--gold);border:0;color:#111;padding:11px 18px;border-radius:24px;font-weight:800;cursor:pointer}.navlinks{display:flex;gap:18px;font-size:13px;color:#ddd}.hero{max-width:1200px;margin:auto;padding:60px 20px 35px;display:grid;grid-template-columns:1.05fr .95fr;gap:35px;align-items:center}.eyebrow{color:var(--gold);letter-spacing:4px;font-size:13px}.hero h1{font:700 clamp(44px,7vw,84px)/.95 Georgia,serif;margin:16px 0}.hero p{color:#bbb;max-width:550px;font-size:17px;line-height:1.7}.heroimg{min-height:430px;border-radius:28px;background:radial-gradient(circle at 50% 25%,#3b2b18,#111 48%,#090909);display:flex;align-items:center;justify-content:center;border:1px solid #292929}.heroimg img{max-width:92%;max-height:430px;object-fit:contain;border-radius:22px}.section{max-width:1200px;margin:auto;padding:25px 20px 60px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.head h2{font:700 38px Georgia;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.pic{aspect-ratio:4/5;background:#171717;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:cover}.prod{padding:16px}.tag{font-size:11px;color:var(--gold);letter-spacing:2px}.prod h3{margin:8px 0;font:20px Georgia}.price{font-weight:800;font-size:20px}.old{text-decoration:line-through;color:#777;font-size:13px;margin-left:6px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.outline{background:#1b1b1b;color:white;border:1px solid #333}.cart{position:fixed;right:20px;bottom:85px;width:58px;height:58px;border-radius:50%;background:var(--gold);border:0;font-size:24px;z-index:8}.chat{position:fixed;left:20px;bottom:20px;background:#151515;color:white;border:1px solid #444;border-radius:28px;padding:13px 18px;z-index:8;cursor:pointer}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.box{background:#111;border:1px solid #333;border-radius:22px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:22px}.form{display:grid;gap:10px}.form input,.form textarea,.form select{background:#0b0b0b;border:1px solid #333;color:white;border-radius:10px;padding:12px}.chatbox{height:330px;overflow:auto;background:#090909;padding:14px;border-radius:15px}.msg{padding:10px 12px;border-radius:14px;margin:7px 0;max-width:85%;white-space:pre-wrap}.bot{background:#1c1c1c}.me{background:#5b4926;margin-left:auto}.chatrow{display:flex;gap:8px}.chatrow input{flex:1}.footer{border-top:1px solid var(--line);padding:40px 20px;color:#888;text-align:center}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="top" id="topbar">✨ Premium Saree Collection • Nationwide Delivery</div>
<nav class="nav"><div class="navin"><img id="logo" class="logo" style="max-height:40px"><div class="search"><input id="search" placeholder="Search saree..."><button onclick="loadProducts()">⌕</button></div><button class="btn" onclick="openCart()">Cart (<span id="count">0</span>)</button></div></nav>
<main><section class="hero"><div><div class="eyebrow">NEW COLLECTION</div><h1 id="tagline">Find Your Perfect Saree</h1><p id="storeinfo"></p><button class="btn" onclick="document.querySelector('#shop').scrollIntoView({behavior:'smooth'})">SHOP NOW →</button></div><div class="heroimg"><img id="heroimg" src="" onerror="this.style.display='none'"></div></section>
<section class="section" id="shop"><div class="head"><h2>Premium Sarees</h2></div><div class="grid" id="products"></div></section></main>
<div class="footer">© SAREE Store</div>
<button class="chat" onclick="openChat()">🤖 AI Shopping Assistant</button><button class="cart" onclick="openCart()">🛒</button>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<script>
let products=[],cart=JSON.parse(localStorage.getItem("saree-cart")||"[]"),settings={};
const money=n=>"৳"+Number(n||0).toLocaleString("en-BD");
async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
async function boot(){settings=await api("/api/settings");document.title=settings.store_name||"SAREE";if(settings.logo)document.getElementById("logo").src=settings.logo;document.getElementById("tagline").textContent=settings.store_tagline||"";document.getElementById("storeinfo").textContent=settings.store_info||"";loadProducts()}
async function loadProducts(){const q=document.getElementById("search").value;products=await api("/api/products?search="+encodeURIComponent(q));render()}
function render(){draw(products);updateCount()}
function draw(ps){document.getElementById("products").innerHTML=ps.map(p=>`<article class="product"><div class="pic">${p.image?`<img src="${p.image}" alt="">`:`<div style="color:#555">SAREE</div>`}</div><div class="prod"><span class="tag">PREMIUM</span><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><div class="actions"><button class="btn outline" onclick="add(${p.id})">Add to Cart</button><button class="btn" onclick="buy(${p.id})">Buy Now</button></div></div></article>`).join("")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function add(id){const x=cart.find(a=>a.id===id);x?x.qty++:cart.push({id,qty:1});save();alert("Added to cart")}
function buy(id){add(id);openCart()}
function save(){localStorage.setItem("saree-cart",JSON.stringify(cart));updateCount()}
function updateCount(){document.getElementById("count").textContent=cart.reduce((a,b)=>a+b.qty,0)}
function openCart(){let rows=cart.map(x=>{let p=products.find(p=>p.id===x.id);return p?`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222"><span>${esc(p.name)} × ${x.qty}</span><b>${money(p.price*x.qty)}</b></div>`:""}).join("");let total=cart.reduce((s,x)=>{let p=products.find(p=>p.id===x.id);return s+(p?p.price*x.qty:0)},0);show(`<h2>Your Cart</h2>${rows||"<p>Your cart is empty.</p>"}<h3>Total: ${money(total)}</h3><button class="btn" onclick="checkout()">Checkout</button> <button class="btn outline" onclick="closeModal()">Close</button>`)}
function checkout(){if(!cart.length)return;let total=cart.reduce((s,x)=>{let p=products.find(p=>p.id===x.id);return s+p.price*x.qty},0);let pays=["COD"];if(settings.bkash_number)pays.push("bKash");if(settings.nagad_number)pays.push("Nagad");if(settings.rocket_number)pays.push("Rocket");show(`<h2>Checkout</h2><p>Total: <b>${money(total)}</b></p><div class="form"><input id="cname" placeholder="আপনার পূর্ণ নাম"><input id="cphone" placeholder="মোবাইল নাম্বার"><textarea id="caddress" placeholder="সম্পূর্ণ delivery address"></textarea><select id="cpm">${pays.map(x=>`<option>${x}</option>`).join("")}</select><input id="ctid" placeholder="Transaction ID (bKash/Nagad হলে দিন)"><button class="btn" onclick="placeOrder()">Confirm Order</button></div>`)}
async function placeOrder(){try{let items=cart.map(x=>({id:x.id,qty:x.qty}));let d=await api("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer_name:document.getElementById("cname").value,phone:document.getElementById("cphone").value,address:document.getElementById("caddress").value,payment_method:document.getElementById("cpm").value,transaction_id:document.getElementById("ctid").value,items})});cart=[];save();show(`<h2>Order Confirmed ❤️</h2><p>Order ID: <b>${d.order_id}</b></p><p>Total: ${money(d.total)}</p><button class="btn" onclick="closeModal()">Done</button>`)}catch(e){alert(e.message)}}
function openChat(){show(`<h2>🤖 AI Shopping Assistant</h2><div class="chatbox" id="chatbox"><div class="msg bot">আসসালামু আলাইকুম ❤️ SAREE-তে স্বাগতম।</div></div><div class="chatrow"><input id="chatinput" placeholder="আপনার message..."><button class="btn" onclick="sendChat()">Send</button></div>`);}
async function sendChat(){let i=document.getElementById("chatinput"),m=i.value.trim();if(!m)return;addMsg(m,"me");i.value="";try{let d=await api("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})});addMsg(d.answer,"bot")}catch(e){addMsg(e.message,"bot")}}
function addMsg(t,c){let b=document.getElementById("chatbox");b.innerHTML+=`<div class="msg ${c}">${esc(t)}</div>`;b.scrollTop=b.scrollHeight}
function show(h){document.getElementById("modalbox").innerHTML=h;document.getElementById("modal").style.display="flex"}function closeModal(){document.getElementById("modal").style.display="none"}
boot()
</script></body></html>
